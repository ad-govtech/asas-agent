# Postgres for the agent registry. Bring it up, then `asas-agent migrate`.
#
# Langfuse is optional. File prompts need only this Postgres instance.
# To use Langfuse, point LANGFUSE_HOST at your self-hosted instance or Cloud.

services:
  postgres:
    image: postgres:17-alpine
    container_name: asas-agent-postgres
    environment:
      POSTGRES_USER: asas
      POSTGRES_PASSWORD: asas
      POSTGRES_DB: asas_agent
    ports:
      - "5433:5432"
    volumes:
      - asas-agent-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asas -d asas_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  asas-agent-data:
