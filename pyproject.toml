[project]
name = "asas-agent"
version = "0.1.0"
description = "Agent-as-configuration runtime: a Postgres registry, file or Langfuse prompts, and a stateless OpenAI Agents SDK runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Factory, Department of Government Enablement" }]
keywords = ["agents", "llm", "openai-agents", "langfuse", "government"]

dependencies = [
    "openai-agents>=0.8,<0.9",
    # Keep the client on the series covered by the real-runner compatibility tests.
    "openai>=2.29,<2.30",
    "fastapi>=0.128,<0.129",
    "uvicorn[standard]>=0.39,<0.40",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.40,<3",
    "asyncpg>=0.30,<0.32",
    "alembic>=1.16,<2",
    "typer>=0.15,<1",
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
langfuse = ["langfuse>=3.7,<4"]
tracing = ["langfuse>=3.7,<4", "openinference-instrumentation-openai-agents>=0.1.20,<2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
]

[project.scripts]
asas-agent = "asas_agent.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asas_agent"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI and Typer declare dependencies and options in argument defaults by design.
"src/asas_agent/api/*.py" = ["B008"]
"src/asas_agent/cli/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
